<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0718">
<title>Is this me? · Bravo Watch Calendar</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--ink:#f5f1ff;--mut:#aea3c8;--line:rgba(255,255,255,.12);--pink:#ff4fae;--sun:#ffd25a;--cyan:#3ee6ea;--green:#47f0a0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);background:#0b0718;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40vmax 40vmax at 8% 0%,rgba(255,79,174,.28),transparent 60%),radial-gradient(38vmax 38vmax at 100% 30%,rgba(62,230,234,.18),transparent 60%)}
.card{width:min(440px,100%);padding:28px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);text-align:center}
.k{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.dot{width:84px;height:84px;margin:18px auto 14px;border-radius:50%;display:grid;place-items:center;font-size:40px}
.off .dot{background:rgba(71,240,160,.14);border:2px solid var(--green)}
.on .dot{background:rgba(255,79,174,.14);border:2px solid var(--pink)}
h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
p{margin:0 0 22px;color:var(--mut)}
button{width:100%;padding:14px;border:0;border-radius:99px;font:800 16px/1 inherit;cursor:pointer;color:#0b0718;background:linear-gradient(90deg,var(--pink),var(--sun))}
.off button{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.links a{padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.back{display:inline-block;margin-top:18px;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main class="card" id="c">
  <div class="k">This device</div>
  <div class="dot" id="dot"></div>
  <h1 id="h"></h1>
  <p id="p"></p>
  <button id="b" type="button"></button>
  <div class="links">
    <a href="https://cloud.umami.is/analytics/us/websites">Taps · Umami</a>
    <a href="https://dash.cloudflare.com/">Visits · Cloudflare</a>
  </div>
  <a class="back" href="/">← Back to the calendar</a>
</main>
<script>
const K="umami.disabled",c=document.getElementById("c");
const get=()=>{try{return !!localStorage.getItem(K)}catch(e){return false}};
function draw(){const off=get();c.className="card "+(off?"off":"on");
  document.getElementById("dot").textContent=off?"🙈":"👀";
  document.getElementById("h").textContent=off?"Not counted":"Counted";
  document.getElementById("p").textContent=off?"Your visits and taps on this device are left out of Umami and Cloudflare. Any stats you see are other people.":"Visits and taps on this device show up in your stats. Turn this off on every phone and laptop you use.";
  document.getElementById("b").textContent=off?"Count this device again":"Don't count this device"}
document.getElementById("b").onclick=()=>{try{get()?localStorage.removeItem(K):localStorage.setItem(K,"1")}catch(e){alert("This browser blocks storage (private mode?), so it can't be excluded.")}draw()};
draw();
</script>
</body>
</html>
