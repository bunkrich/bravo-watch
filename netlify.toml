[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Old addresses -> new home (keeps paths and ?me)
[[redirects]]
  from = "https://bravo.bunkrich.com/*"
  to = "https://clubhousetonight.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://bravo.bunkrich.com/*"
  to = "https://clubhousetonight.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://bravo-watch.netlify.app/*"
  to = "https://clubhousetonight.com/:splat"
  status = 301
  force = true

# Keep source/build files private
[[redirects]]
  from = "/template.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/build.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/check.js"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/prerender.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/showpages.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/showpages.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/widget.tpl.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[headers]]
  for = "/version.txt"
  [headers.values]
    Cache-Control = "no-cache"
[[redirects]]
  from = "/prerendered.json"
  to = "/404.html"
  status = 404
  force = true
